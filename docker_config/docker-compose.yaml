services:
  mysql:
    image: mysql:8.0
    container_name: mysql8
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=data1
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
    user: root
    restart: unless-stopped # 添加重启策略
    healthcheck: # 添加健康检查
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: redis
    environment:
      - REDIS_PASSWORD=1234567 # 添加Redis密码
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data # 修复卷挂载路径
    command: redis-server --requirepass 1234567 # 添加密码认证
    restart: unless-stopped # 添加重启策略
    healthcheck: # 添加健康检查
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 3s
      retries: 5

  redis-bloomfilter:
    image: redis:7.2-alpine
    container_name: redis-bloomfilter
    environment:
      - REDIS_PASSWORD=12345678 # 添加Redis密码
    ports:
      - "6380:6379" # 修复端口冲突，使用6380
    volumes:
      - ./redis_bloomfilter_data:/data # 修复卷挂载路径
    command: redis-server --requirepass 12345678 # 添加密码认证
    restart: unless-stopped # 添加重启策略
    healthcheck: # 添加健康检查
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      timeout: 3s
      retries: 5

networks:
  default:
    name: data_process_network # 添加自定义网络名称